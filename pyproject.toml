[project]
name = "nlp"
version = "0.1.0"
description = "Cross-lingual cultural sentiment study (ZH/ES/EN)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.40",
    "accelerate>=1.1.0",
    "datasets>=2.19",
    "torch>=2.2",
    "sacremoses>=0.1",
    "praw>=7.7",
    "polars>=0.20",
    "langdetect>=1.0",
    "jieba>=0.42",
    "requests>=2.31",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "fastapi>=0.111",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pytest>=8.2",
    "uvicorn>=0.29",
    "streamlit>=1.35",
    "mlflow>=2.12",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "ipykernel>=6.29"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.pyright]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
